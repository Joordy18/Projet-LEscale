services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lescale-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://lescale:lescale_dev@postgres:5432/lescale
      MONGODB_URI: mongodb://mongodb:27017/lescale
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: lescale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lescale
      POSTGRES_PASSWORD: lescale_dev
      POSTGRES_DB: lescale
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lescale -d lescale']
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:8
    container_name: lescale-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
