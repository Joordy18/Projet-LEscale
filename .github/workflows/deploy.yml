name: Deploy (recette)

# Déploiement continu : chaque intégration sur master publie une image puis met à jour l'environnement de recette.
# Le serveur de recette (plateforme à faire valider par le formateur) est décrit dans docs/deploiement/deploiement.md.
# Tant que les secrets RECETTE_* ne sont pas définis dans GitHub, seule l'image est publiée.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette d'image à déployer (retour arrière : un ancien sha-xxxxxxx)"
        required: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publier l'image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      tag: sha-${{ steps.meta.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:master
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE }}-migrate:master
            ${{ env.IMAGE }}-migrate:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha

  deploy:
    name: Déployer en recette
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    environment: recette

    steps:
      - name: Check deployment secrets
        id: secrets
        env:
          HOST: ${{ secrets.RECETTE_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secrets RECETTE_* absents : déploiement ignoré (image publiée seulement)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ github.event.inputs.tag || needs.publish.outputs.tag || 'master' }}
        with:
          host: ${{ secrets.RECETTE_HOST }}
          username: ${{ secrets.RECETTE_USER }}
          key: ${{ secrets.RECETTE_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd ~/lescale
            # Applique les migrations avec l'image du même commit, puis redémarre l'application.
            export APP_IMAGE=ghcr.io/${{ github.repository }}:$TAG
            export MIGRATE_IMAGE=ghcr.io/${{ github.repository }}-migrate:$TAG
            docker compose -f docker-compose.recette.yml --env-file .env.recette pull app migrate
            docker compose -f docker-compose.recette.yml --env-file .env.recette up -d --no-build
            docker compose -f docker-compose.recette.yml --env-file .env.recette ps
